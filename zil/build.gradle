plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'rental'
version '1.0-SNAPSHOT'

java {
    toolchain {
        // Spring Boot 4 требует минимум Java 17; здесь 25 — совпадает с типичной установкой для этого проекта.
        // Плагин Foojay в settings.gradle позволяет Gradle подтянуть JDK под toolchain при необходимости.
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Основной стартер
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // OpenAPI 3 + Swagger UI (https://springdoc.org/) — LAB6, проверка API в браузере
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    // LAB2: Spring Data JPA + PostgreSQL
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // LAB12: потребление сообщений из Kafka — https://www.baeldung.com/spring-kafka#consuming-messages
    implementation 'org.springframework.boot:spring-boot-starter-kafka'

    // БАЗОВЫЙ тестовый стартер (JUnit 5, AssertJ, Mockito)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // КРИТИЧЕСКИ ВАЖНО: Стартер для поддержки @AutoConfigureMockMvc в Spring Boot 4
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    // JUnit 5 (Jupiter) теперь является единственным поддерживаемым стандартом
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Тесты без Docker Postgres — in-memory H2
    testRuntimeOnly 'com.h2database:h2'

    // Spring Boot 4: автоконфигурация Flyway идёт из стартера, одного flyway-core недостаточно.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    // Поддержка PostgreSQL в Flyway (драйвер/особенности БД)
    implementation 'org.flywaydb:flyway-database-postgresql'
}

tasks.named('test') {
    useJUnitPlatform()
    // Один форк — меньше одновременных JVM при нехватке RAM на хосте (Windows)
    maxParallelForks = 1
    jvmArgs '-Xmx384m', '-XX:MaxMetaspaceSize=192m'
}
