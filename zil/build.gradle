plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'rental'
version '1.0-SNAPSHOT'

java {
    toolchain {
        // Spring Boot 4 требует минимум Java 17; здесь 25 — совпадает с типичной установкой для этого проекта.
        // Плагин Foojay в settings.gradle позволяет Gradle подтянуть JDK под toolchain при необходимости.
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Основной стартер
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // БАЗОВЫЙ тестовый стартер (JUnit 5, AssertJ, Mockito)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // КРИТИЧЕСКИ ВАЖНО: Стартер для поддержки @AutoConfigureMockMvc в Spring Boot 4
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    // JUnit 5 (Jupiter) теперь является единственным поддерживаемым стандартом
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}