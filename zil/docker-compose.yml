# PostgreSQL + Spring Boot — один файл для цепочки лаб (LAB6 → LAB7 → LAB8).
#
# ═══════════════════════════════════════════════════════════════════════════════
# ОБРАЗ APP (Harbor ИЛИ Docker Hub)
# ═══════════════════════════════════════════════════════════════════════════════
# Переменная ZIL_APP_IMAGE задаёт, откуда тянуть образ основного сервиса.
#
# • Harbor (курс): docker login hlssh.zil.digital:2313
#     export ZIL_APP_IMAGE=hlssh.zil.digital:2313/<проект>/zil-app:lab6
#
# • Docker Hub (если Harbor не используешь — см. LAB6_PLAN_RU §15):
#     docker login -u <DOCKER_ID>   # пароль = PAT с hub.docker.com
#     export ZIL_APP_IMAGE=docker.io/<DOCKER_ID>/zil-app:lab6
#
# Образ postgres:16-alpine тянется с публичного Hub; при лимитах анонимных pull — docker login Hub.
#
# ═══════════════════════════════════════════════════════════════════════════════
# ПОДКЛЮЧЕНИЕ К БД (зависит от ветки / этапа лабы)
# ═══════════════════════════════════════════════════════════════════════════════
# LAB6 (этот файл на ветке lab6-vm-docker-k6): app ходит в ЛОКАЛЬНЫЙ контейнер postgres
#   ниже — SPRING_DATASOURCE_* на postgres:5432 + depends_on postgres — это норма для ТЗ LAB6.
#
# LAB7 (ветка lab7, см. LAB7_PLAN_RU): БД на узле hl12.zil — в app.environment задают
#   DBHOST, DBPORT, DBNAME, SCHEMANAME, SPRING_DATASOURCE_USERNAME/PASSWORD;
#   строка JDBC в application.properties через ${DBHOST}… (не через postgres hostname).
#   depends_on: postgres у app обычно убирают или не поднимают локальный postgres для защиты.
#
# LAB8: как LAB7 по БД + второй сервис additional (ветка lab8-ads, см. LAB8_PLAN_RU).
#
# ═══════════════════════════════════════════════════════════════════════════════
# CPU/RAM (LAB6 k6, LAB8 измерения)
# ═══════════════════════════════════════════════════════════════════════════════
#   export APP_CPUS=0.5   # или 1.0, 1.5, 2.0 …
#   export APP_MEM=768m
#   docker compose up -d --force-recreate --no-deps app
# Проверка: docker inspect zil-app --format '{{.HostConfig.NanoCpus}} {{.HostConfig.Memory}}'
#
# ═══════════════════════════════════════════════════════════════════════════════
# Локальная разработка и Swagger
# ═══════════════════════════════════════════════════════════════════════════════
# Локально: open-swagger.ps1 / open-swagger.cmd → http://127.0.0.1:8083/swagger-ui/index.html
# Только БД под IDE: docker compose up -d postgres  →  jdbc:postgresql://localhost:5433/car_rental
#
services:
  postgres:
    image: postgres:16-alpine
    container_name: zil-postgres
    environment:
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental_pass
      POSTGRES_DB: car_rental
    ports:
      - "5433:5432"
    volumes:
      - zil_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental -d car_rental"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${ZIL_APP_IMAGE:-hlssh.zil.digital:2313/truchekaterina/zil-app:lab6}
    container_name: zil-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/car_rental
      SPRING_DATASOURCE_USERNAME: rental
      SPRING_DATASOURCE_PASSWORD: rental_pass
      SPRING_JPA_SHOW_SQL: "false"
      SERVER_TOMCAT_THREADS_MAX: "50"
    ports:
      - "8083:8083"
    cpus: "${APP_CPUS:-1.0}"
    mem_limit: "${APP_MEM:-768m}"

volumes:
  zil_pgdata:
