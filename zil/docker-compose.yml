# LAB3: PostgreSQL + Spring Boot.
# 1) Собрать jar: prepare-docker.ps1 или prepare-docker.bat
# 2) Запуск: docker compose up --build -d
# Если app снова падает на java: только БД — docker compose up -d postgres, приложение — gradlew bootRun (localhost:5433).
#
# IntelliJ / хост: jdbc:postgresql://localhost:5433/car_rental
# Контейнер app:  jdbc:postgresql://postgres:5432/car_rental

services:
  postgres:
    image: postgres:16-alpine
    container_name: zil-postgres
    environment:
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental_pass
      POSTGRES_DB: car_rental
    ports:
      - "5433:5432"
    volumes:
      - zil_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental -d car_rental"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zil-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/car_rental
      SPRING_DATASOURCE_USERNAME: rental
      SPRING_DATASOURCE_PASSWORD: rental_pass
    ports:
      - "8082:8082"

volumes:
  zil_pgdata:
