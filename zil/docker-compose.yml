# PostgreSQL (официальный postgres:16-alpine с registry-1.docker.io) + Spring Boot.
# Образ приложения app только из Harbor (см. image ниже); Docker Hub для push своего JAR-образа не используем.
#
# Сервис app по умолчанию: ZIL_APP_IMAGE = hlssh.zil.digital:2313/<проект>/zil-app:lab6
# (см. LAB8: «На Harbor/registry» — docker login <HARBOR_HOST>:<HARBOR_PORT>).
# Проект в Harbor должен совпадать с тем, что создали/выдали на курсе; если другой — задайте:
#   PowerShell:  $env:ZIL_APP_IMAGE="hlssh.zil.digital:2313/ВАШ_ПРОЕКТ/zil-app:lab6"
#   bash:        export ZIL_APP_IMAGE=...
# или файл .env рядом с этим compose (не коммитьте пароли).
#
# Сборка и пуш (на ПК или на прикладной ВМ, из папки zil):
#   docker login hlssh.zil.digital:2313
#   docker build -t hlssh.zil.digital:2313/truchekaterina/zil-app:lab6 .
#   docker push  hlssh.zil.digital:2313/truchekaterina/zil-app:lab6
# На ВМ после git pull:  docker compose pull app && docker compose up -d
#
# Если Harbor на HTTP и Docker ругается на HTTPS — по инструкции курса добавьте insecure-registries
# в Docker Desktop / /etc/docker/daemon.json (только host:port из таблицы).
#
# Локально: open-swagger.ps1 / open-swagger.cmd, Swagger: http://127.0.0.1:8083/swagger-ui/index.html
# Только БД под IDE / bootRun: docker compose up -d postgres (localhost:5433).
#
# IntelliJ / хост: jdbc:postgresql://localhost:5433/car_rental
# Контейнер app:  jdbc:postgresql://postgres:5432/car_rental
#
# LAB6: лимиты CPU/RAM и смесь нагрузки меняй через env на хосте перед up:
#   export APP_CPUS=0.5
#   export APP_MEM=768m
#   docker compose up -d --force-recreate --no-deps app
# Проверка: docker inspect zil-app --format '{{.HostConfig.NanoCpus}} {{.HostConfig.Memory}}'
# 0.5 CPU -> 500000000 наносек, 1.0 -> 1000000000, 1.5 -> 1500000000, 2.0 -> 2000000000

services:
  postgres:
    image: postgres:16-alpine
    container_name: zil-postgres
    environment:
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental_pass
      POSTGRES_DB: car_rental
    ports:
      - "5433:5432"
    volumes:
      - zil_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental -d car_rental"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${ZIL_APP_IMAGE:-hlssh.zil.digital:2313/truchekaterina/zil-app:lab6}
    container_name: zil-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/car_rental
      SPRING_DATASOURCE_USERNAME: rental
      SPRING_DATASOURCE_PASSWORD: rental_pass
      SPRING_JPA_SHOW_SQL: "false"
      # server.tomcat.threads.max (Spring Boot 3+; см. внешнюю конфигурацию)
      SERVER_TOMCAT_THREADS_MAX: "50"
    ports:
      - "8083:8083"
    # Лимиты CPU/RAM: cpus + mem_limit задают HostConfig на обычном `docker compose up` (без Swarm).
    # Секция `deploy.resources` в части окружений не применяется к `compose up` — тогда в inspect
    # всегда 1 CPU (1000000000 нс). Подставляется из env хоста: export APP_CPUS=0.5 перед up.
    cpus: "${APP_CPUS:-1.0}"
    mem_limit: "${APP_MEM:-768m}"

volumes:
  zil_pgdata:
