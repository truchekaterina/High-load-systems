# LAB3: PostgreSQL + Spring Boot. Сборка app: zil/Dockerfile (bootJar внутри контейнера).
# Из папки zil: docker compose up --build -d  (или open-swagger.ps1 / open-swagger.cmd)
# LAB6 / Swagger: http://127.0.0.1:8083/swagger-ui/index.html
# Только БД под IDE / bootRun: docker compose up -d postgres (localhost:5433).
#
# IntelliJ / хост с локальной БД: jdbc:postgresql://localhost:5433/car_rental
# LAB7 app: удаленная БД через env DBHOST/DBPORT/DBNAME (hl12.zil:5437/hl7)
#
# LAB6: лимиты CPU/RAM и смесь нагрузки меняй через env на хосте перед up:
#   export APP_CPUS=0.5
#   export APP_MEM=768m
#   docker compose up -d --force-recreate --no-deps app
# Проверка: docker inspect zil-app --format '{{.HostConfig.NanoCpus}} {{.HostConfig.Memory}}'
# 0.5 CPU -> 500000000 наносек, 1.0 -> 1000000000, 1.5 -> 1500000000, 2.0 -> 2000000000

services:
  postgres:
    image: postgres:16-alpine
    container_name: zil-postgres
    environment:
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental_pass
      POSTGRES_DB: car_rental
    ports:
      - "5433:5432"
    volumes:
      - zil_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental -d car_rental"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zil-app
    environment:
      DBHOST: hl12.zil
      DBPORT: "5437"
      DBNAME: hl7
      SCHEMANAME: hl7
      SPRING_DATASOURCE_USERNAME: hl7
      SPRING_DATASOURCE_PASSWORD: hl7
      SPRING_JPA_SHOW_SQL: "false"
      # server.tomcat.threads.max (Spring Boot 3+; см. внешнюю конфигурацию)
      SERVER_TOMCAT_THREADS_MAX: "50"
    ports:
      - "8083:8083"
    # Лимиты CPU/RAM: cpus + mem_limit задают HostConfig на обычном `docker compose up` (без Swarm).
    # Секция `deploy.resources` в части окружений не применяется к `compose up` — тогда в inspect
    # всегда 1 CPU (1000000000 нс). Подставляется из env хоста: export APP_CPUS=0.5 перед up.
    cpus: "${APP_CPUS:-1.0}"
    mem_limit: "${APP_MEM:-768m}"

volumes:
  zil_pgdata:
