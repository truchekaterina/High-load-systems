# Spring Boot (app) + LAB8 additional. **app** — образ с Docker Hub; **additional** — с Harbor.
# LAB6 Swagger: http://127.0.0.1:8083/swagger-ui/index.html
#
# Локального PostgreSQL в этом проекте нет: только удалённая БД (узел hl12 и т.п.).
#
# Перед `up`: файл `registry-tags-lab8-hl7.env` (JDBC + теги). У **всех** команд compose в этом проекте используйте тот же файл:
#   `--env-file registry-tags-lab8-hl7.env` — иначе ошибки вида «DBNAME is missing» (${…:?…} в environment).
# Для pull **additional** нужен `docker login hl13.zil:8888`.
#   docker compose --env-file registry-tags-lab8-hl7.env pull app additional
#   docker compose --env-file registry-tags-lab8-hl7.env up -d app additional
#   docker compose --env-file registry-tags-lab8-hl7.env ps
#   docker compose --env-file registry-tags-lab8-hl7.env logs app --tail 80
# Сборка **app** из репозитория: добавьте в сервис `app` блок `build:` (см. Dockerfile) — не используется при Hub-образе.
#
# ВМ приложения (hl07): bash scripts/vm2307-deploy-lab8.sh — подтягивает тот же env.
#
# Windows: open-swagger.ps1 / open-swagger.cmd ожидают registry-tags-lab8-hl7.env рядом со скриптом.
#
# Нужен Docker Compose **v2.20+** (совместимость с синтаксисом depends_on: required).

# LAB6: на хосте перед up можно задать лимиты: export APP_CPUS=0.5 APP_MEM=768m
# LAB8/LAB9: ZIL_ADDITIONAL_IMAGE и ZIL_APP_IMAGE см. registry-tags*.env.

# LAB7 узел БД (hl12): отдельно docker-compose.lab7-db-node.yml — не смешивать с ВМ приложения.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${ZIL_APP_IMAGE:-docker.io/rinakt/zil-app:lab9}
    container_name: zil-app
    environment:
      DBHOST: ${DBHOST:?Set DBHOST in env or registry-tags-lab8-hl7.env}
      DBPORT: ${DBPORT:?Set DBPORT in env or registry-tags-lab8-hl7.env}
      DBNAME: ${DBNAME:?Set DBNAME in env or registry-tags-lab8-hl7.env}
      SCHEMANAME: ${SCHEMANAME:?Set SCHEMANAME in env or registry-tags-lab8-hl7.env}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?Set SPRING_DATASOURCE_USERNAME in env or registry file}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD in env or registry file}
      SPRING_FLYWAY_SCHEMAS: ${SCHEMANAME:?Set SCHEMANAME in env or registry-tags-lab8-hl7.env}
      SPRING_FLYWAY_DEFAULT_SCHEMA: ${SCHEMANAME:?Set SCHEMANAME in env or registry-tags-lab8-hl7.env}
      SPRING_FLYWAY_CREATE_SCHEMAS: ${SPRING_FLYWAY_CREATE_SCHEMAS:-false}
      SPRING_JPA_SHOW_SQL: "false"
      SERVER_TOMCAT_THREADS_MAX: "50"
      # При большой БД (k6/LAB9+) без увеличения кучи возможен OOM на /stats и findAll — см. APP_JAVA_TOOL_OPTIONS.
      JAVA_TOOL_OPTIONS: ${APP_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75}
      # LAB12: при деплое через compose укажите реальные bootstrap с ВМ (или тот же туннель к брокерам)
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-hl15.zil:9094,hl14.zil:9094}
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${SPRING_KAFKA_CONSUMER_GROUP_ID:-rental-app-lab12-hl07}
      # LAB12 по умолчанию hl07; LAB13 (ровно 2 партиции): второй env-файл registry-tags-lab13-topic.env → hl07-lab13
      KAFKA_TOPIC: ${KAFKA_TOPIC:-hl07}
      # LAB13: для матрицы 1×2 задайте 1 или 2 (≤ числа партиций топика; для hl07-lab13 — 2 партиции).
      KAFKA_LISTENER_CONCURRENCY: ${KAFKA_LISTENER_CONCURRENCY:-2}
    # LAB12: брокеры в metadata отдают hl14/hl15; внутри контейнера нужен статический резолв.
    # IP из общей таблицы курса (kafka-1 / kafka-2, LAB11): при расхождении подставь свои адреса.
    extra_hosts:
      - "hl14.zil:10.60.3.12"
      - "hl15.zil:10.60.3.13"
    ports:
      - "8083:8083"
    cpus: "${APP_CPUS:-1.0}"
    mem_limit: "${APP_MEM:-768m}"

  additional:
    image: ${ZIL_ADDITIONAL_IMAGE:-hl13.zil:8888/katya/zil-additional-service:lab9}
    container_name: zil-additional-service
    environment:
      MAIN_SERVICE_BASE_URL: http://app:8083
      SERVER_PORT: "8084"
    ports:
      - "8084:8084"
    depends_on:
      - app
    cpus: "${ADDITIONAL_CPUS:-1.0}"
    mem_limit: "${ADDITIONAL_MEM:-512m}"
