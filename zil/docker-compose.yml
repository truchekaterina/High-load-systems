# LAB3+ : PostgreSQL (опционально) + Spring Boot. Сборка app: zil/Dockerfile (bootJar внутри контейнера).
# LAB6 / Swagger: http://127.0.0.1:8083/swagger-ui/index.html
#
# Нужен Docker Compose **v2.20+** (атрибут depends_on.required: false).

# Режим A — локально: Postgres в Docker + app (+ LAB8 additional). Профиль **local-db** включает postgres.
#   docker compose --profile local-db up --build -d
#   Только БД под IDE / bootRun: docker compose --profile local-db up -d postgres  (JDBC с хоста: localhost:5433/car_rental)
#   open-swagger.ps1 / open-swagger.cmd — то же с профилем local-db.
#
# Режим B — ВМ приложения (hl07): удалённая БД на hl12, контейнер postgres не нужен.
#   1) Скопируйте и при необходимости отредактируйте registry-tags-lab8-hl7.env (DBHOST, DBPORT=5433, DBNAME, ZIL_* , пароль БД).
#   2) На ВМ: docker login hl13.zil:8888 (insecure-registries в /etc/docker/daemon.json при необходимости)
#   3) set -a && . ./registry-tags-lab8-hl7.env && set +a && docker compose pull && docker compose up -d --force-recreate
#   Либо: bash scripts/vm2307-deploy-lab8.sh
#
# LAB6: лимиты CPU/RAM на хосте перед up: export APP_CPUS=0.5 APP_MEM=768m
# LAB8: ZIL_ADDITIONAL_IMAGE — образ additional (Harbor/Docker Hub). export ADDITIONAL_CPUS=0.5 при необходимости.
# Проверка лимитов: docker inspect zil-app --format '{{.HostConfig.NanoCpus}} {{.HostConfig.Memory}}'
#
# LAB7 (узел БД hl12): PostgreSQL + pgAdmin и max_connections=1000 — отдельный файл
#   docker-compose.lab7-db-node.yml (запуск на ВМ БД, не на ВМ приложения).

services:
  postgres:
    profiles: ["local-db"]
    image: postgres:16-alpine
    container_name: zil-postgres
    environment:
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental_pass
      POSTGRES_DB: car_rental
    ports:
      - "5433:5432"
    volumes:
      - zil_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental -d car_rental"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${ZIL_APP_IMAGE:-zil-app:local}
    container_name: zil-app
    environment:
      # Локально (профиль local-db): DBHOST=postgres, DBPORT=5432. ВМ → hl12.zil и 5433 (см. registry-tags-lab8-hl7.env).
      DBHOST: ${DBHOST:-postgres}
      DBPORT: ${DBPORT:-5432}
      DBNAME: ${DBNAME:-car_rental}
      SCHEMANAME: ${SCHEMANAME:-hl7}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-rental}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-rental_pass}
      SPRING_JPA_SHOW_SQL: "false"
      # server.tomcat.threads.max (Spring Boot 3+; см. внешнюю конфигурацию)
      SERVER_TOMCAT_THREADS_MAX: "50"
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    # Лимиты CPU/RAM: cpus + mem_limit задают HostConfig на обычном `docker compose up` (без Swarm).
    # Секция `deploy.resources` в части окружений не применяется к `compose up` — тогда в inspect
    # всегда 1 CPU (1000000000 нс). Подставляется из env хоста: export APP_CPUS=0.5 перед up.
    cpus: "${APP_CPUS:-1.0}"
    mem_limit: "${APP_MEM:-768m}"

  # LAB8 Additional: образ из репозитория github.com/truchekaterina/zil-additional-service
  # (сборка там или в CI → push в Harbor/Docker Hub; здесь задаётся тег переменной ZIL_ADDITIONAL_IMAGE).
  additional:
    image: ${ZIL_ADDITIONAL_IMAGE:-zil-additional:local}
    container_name: zil-additional
    environment:
      # Совпадает с zil-additional-service: main-service.base-url (приоритет MAIN_SERVICE_BASE_URL, иначе см. application.properties).
      MAIN_SERVICE_BASE_URL: http://app:8083
    ports:
      - "8084:8084"
    depends_on:
      - app
    cpus: "${ADDITIONAL_CPUS:-1.0}"
    mem_limit: "${ADDITIONAL_MEM:-384m}"

volumes:
  zil_pgdata:
