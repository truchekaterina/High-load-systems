# PostgreSQL + (опционально) pgAdmin — LAB2
# Запуск из папки zil: docker compose up -d
#
# Запишите для подключения из Spring Boot (application.properties):
#   хост:     localhost
#   порт:     5433  (на хосте; внутри сети compose — 5432)
#   БД:       car_rental
#   пользователь: rental
#   пароль:   rental_pass

services:
  postgres:
    image: postgres:16-alpine
    container_name: zil-postgres
    environment:
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental_pass
      POSTGRES_DB: car_rental
    ports:
      # 5433 на хосте: чтобы не пересекаться с локальным PostgreSQL на Windows (часто слушает :5432)
      - "5433:5432"
    volumes:
      - zil_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental -d car_rental"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: zil-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  zil_pgdata:
