# Тесты: H2 в памяти (PostgreSQL не нужен для gradlew test)
# Миграции Flyway для Postgres не гоняем в тестах — схему создаёт Hibernate (ddl-auto ниже).
spring.flyway.enabled=false
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# LAB9: те же ключи, что в основном профиле (тесты поднимают полный контекст)
observability.window.short=10s
observability.window.medium=30s
observability.window.long=1m
observability.log-interval=PT60S
spring.task.scheduling.enabled=false

# LAB12: не поднимать реальных консьюмеров при юнит/интеграционных тестах без брокера
spring.kafka.bootstrap-servers=127.0.0.1:9092
spring.kafka.listener.auto-startup=false
spring.kafka.consumer.group-id=rental-test
spring.kafka.consumer.auto-offset-reset=earliest

app.kafka.topic=hl07-test
app.kafka.listener.concurrency=1
