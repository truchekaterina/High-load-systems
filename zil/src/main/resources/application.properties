# Car Rental Service - базовые настройки приложения.

# На каком HTTP-порту будет доступно Spring Boot приложение.
server.port=8083

# URL подключения к PostgreSQL.
# Формат ${ENV_VAR:default} значит:
# - если переменная окружения ENV_VAR задана, берём её;
# - если не задана, используется значение после ":".
#
# Дефолты под стенд «общая БД на hl12» (см. registry-tags-lab8-hl7.env).
# DBHOST=localhost — если с ПК проброшен порт 5433 (SSH-туннель); на ВМ приложения задайте DBHOST=hl12.zil через env / IDE / compose.
spring.datasource.url=jdbc:postgresql://${DBHOST:localhost}:${DBPORT:5433}/${DBNAME:hl7}?currentSchema=${SCHEMANAME:hl7}

# Логин к БД (роль приложения на общей БД — обычно hl7).
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:hl7}

# Пароль к БД (переопределяется переменной окружения или compose env-file).
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hl7_labs}

# JDBC-драйвер PostgreSQL.
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate только проверяет, что схема БД соответствует @Entity.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
# На общей БД схему создаёт админ; роль приложения только мигрирует внутри схемы.
spring.flyway.create-schemas=false

spring.flyway.schemas=${SCHEMANAME:hl7}
spring.flyway.default-schema=${SCHEMANAME:hl7}

# --- OpenAPI / Swagger UI (springdoc) ---
# Локально порт = server.port (обычно 8083). Не путайте с 8080.
#   http://localhost:8083/swagger-ui/index.html
#   http://localhost:8083/v3/api-docs
# «Одним кликом» (Docker + браузер): zil/open-swagger.ps1 / open-swagger.cmd
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# LAB9 Observability — скользящие окна статистики и интервал сводки в лог
observability.window.short=10s
observability.window.medium=30s
observability.window.long=1m
observability.log-interval=PT5S

# --- LAB12: Kafka consumer (только модуль rental / app, не additional) ---
# Локально с туннелем LAB11: 19094 -> hl15:9094, 19095 -> hl14:9094 (см. LAB11_MANUAL_FULL_RU.md §8.2).
# На ВМ в сети курса подставьте то, что открыто с этой ВМ (часто hl15.zil:9094,hl14.zil:9094).
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:19094,127.0.0.1:19095}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:rental-app-lab12-hl07}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Топик из Google Sheet (Трюх Екатерина — обычно hl07; сверьте колонку Kafka Topic).
app.kafka.topic=${KAFKA_TOPIC:hl07}
# Потоков listener не больше числа партиций топика; для hl07 можно задать 3 после kafka-topics --alter.
app.kafka.listener.concurrency=${KAFKA_LISTENER_CONCURRENCY:3}
