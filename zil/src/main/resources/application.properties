# Car Rental Service - базовые настройки приложения.

# На каком HTTP-порту будет доступно Spring Boot приложение.
server.port=8083

# URL подключения к PostgreSQL.
# Формат ${ENV_VAR:default} значит:
# - если переменная окружения ENV_VAR задана, берём её;
# - если не задана, используем значение после ":".
# Это позволяет запускать один и тот же код локально и в Docker без правок файла.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/car_rental}

# Логин к БД (также можно переопределить через переменную окружения).
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rental}

# Пароль к БД (также можно переопределить через переменную окружения).
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rental_pass}

# JDBC-драйвер PostgreSQL, через который Java подключается к базе.
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate только проверяет, что схема БД соответствует @Entity.
# Схему и начальные данные создаёт Flyway миграциями (V1, V2, ...).
spring.jpa.hibernate.ddl-auto=validate

# Показывать SQL-запросы Hibernate в логах (полезно для обучения и отладки).
spring.jpa.show-sql=true

# Делать SQL в логах более читаемым (с переносами/отступами).
spring.jpa.properties.hibernate.format_sql=true

# Отключаем Open Session in View (рекомендуется для более предсказуемой работы с БД).
spring.jpa.open-in-view=false

# Включает Flyway: при старте приложения он применяет SQL-миграции из db/migration.
spring.flyway.enabled=true
