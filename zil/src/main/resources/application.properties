# Car Rental Service - базовые настройки приложения.

# На каком HTTP-порту будет доступно Spring Boot приложение.
server.port=8083

# Потоки Tomcat (LAB6: в docker-compose через SERVER_TOMCAT_THREADS_MAX — см. Baeldung / Spring relaxed binding).
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:50}

# URL подключения к PostgreSQL.
# Формат ${ENV_VAR:default} значит:
# - если переменная окружения ENV_VAR задана, берём её;
# - если не задана, используем значение после ":".
# Это позволяет запускать один и тот же код локально и в Docker без правок файла.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/car_rental}

# Логин к БД (также можно переопределить через переменную окружения).
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rental}

# Пароль к БД (также можно переопределить через переменную окружения).
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rental_pass}

# JDBC-драйвер PostgreSQL, через который Java подключается к базе.
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate только проверяет, что схема БД соответствует @Entity.
# Схему и начальные данные создаёт Flyway миграциями (V1, V2, ...).
spring.jpa.hibernate.ddl-auto=validate

# Показывать SQL Hibernate в логах. В Docker переопределяется через SPRING_JPA_SHOW_SQL (как в docker-compose.yml).
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}

# Делать SQL в логах более читаемым (с переносами/отступами).
spring.jpa.properties.hibernate.format_sql=true

# Отключаем Open Session in View (рекомендуется для более предсказуемой работы с БД).
spring.jpa.open-in-view=false

# Включает Flyway: при старте приложения он применяет SQL-миграции из db/migration.
spring.flyway.enabled=true

# --- OpenAPI / Swagger UI (springdoc) ---
# Локально порт = server.port (см. выше, обычно 8083). Не путайте с 8080.
#
# Сразу в браузер (рекомендуется):
#   http://localhost:8083/swagger-ui/index.html
# Редиректы из springdoc + наши алиасы в SwaggerUiWebConfiguration:
#   http://localhost:8083/swagger-ui.html  ->  .../index.html
#   http://localhost:8083/swagger         ->  .../index.html
#   http://localhost:8083/api-docs        ->  .../index.html
# JSON OpenAPI 3:
#   http://localhost:8083/v3/api-docs
# «Одним кликом» (Docker + браузер): в папке zil — open-swagger.ps1 или open-swagger.cmd
#
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
