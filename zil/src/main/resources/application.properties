# Car Rental Service - базовые настройки
server.port=8082

# --- LAB2: PostgreSQL (как в docker-compose.yml) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/car_rental
spring.datasource.username=rental
spring.datasource.password=rental_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (позже появятся @Entity — таблицы создадутся/обновятся)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
