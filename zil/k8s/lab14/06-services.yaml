apiVersion: v1
kind: Service
metadata:
  name: zil-app-internal
  namespace: hl07
spec:
  type: ClusterIP
  selector:
    app: zil-app
  ports:
    - name: http
      port: 8083
      targetPort: 8083
---
apiVersion: v1
kind: Service
metadata:
  name: zil-app-nodeport
  namespace: hl07
spec:
  type: NodePort
  selector:
    app: zil-app
  ports:
    - name: http
      port: 8083
      targetPort: 8083
      nodePort: 32083
---
apiVersion: v1
kind: Service
metadata:
  name: zil-additional-nodeport
  namespace: hl07
spec:
  type: NodePort
  selector:
    app: zil-additional
  ports:
    - name: http
      port: 8084
      targetPort: 8084
      nodePort: 32084
