apiVersion: apps/v1
kind: Deployment
metadata:
  name: zil-additional
  namespace: hl07
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zil-additional
  template:
    metadata:
      labels:
        app: zil-additional
    spec:
      imagePullSecrets:
        - name: harbor-regcred
      containers:
        - name: additional
          # В registry-tags указано hl13.zil:8888; kubelet на нодах тянет образ до старта Pod и часто не резолвит hl13.zil — для pull используем IP Harbor из таблицы (10.60.3.11).
          image: 10.60.3.11:8888/katya/zil-additional-service:lab10
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          env:
            - name: MAIN_SERVICE_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: zil-config
                  key: MAIN_SERVICE_BASE_URL
            - name: SERVER_PORT
              value: "8084"
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "1Gi"
