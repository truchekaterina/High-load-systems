apiVersion: apps/v1
kind: Deployment
metadata:
  name: zil-additional
  namespace: hl07
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zil-additional
  template:
    metadata:
      labels:
        app: zil-additional
    spec:
      imagePullSecrets:
        - name: harbor-regcred
      containers:
        - name: additional
          # Совпадает с ZIL_ADDITIONAL_IMAGE в registry-tags-lab8-hl7.env
          image: hl13.zil:8888/katya/zil-additional-service:lab10
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          env:
            - name: MAIN_SERVICE_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: zil-config
                  key: MAIN_SERVICE_BASE_URL
            - name: SERVER_PORT
              value: "8084"
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "1Gi"
